<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Loading…</title>
<style>
:root{color-scheme:light;--ink:#0b0d1f;--ink-2:#4b5175;--ink-3:#686e92;--paper:#fff;--line:rgba(11,13,31,.12);--good:#0f7a53;--warn:#b23a1c;--r:16px;
  --f-body:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;--f-display:"Instrument Serif","Iowan Old Style",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:28px 18px 56px}
.biz{font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.test{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#fdeee9;color:var(--warn);font:600 11px/1 var(--f-body);letter-spacing:.08em}
h1{font:400 34px/1.1 var(--f-display);margin:10px 0 8px}
h2{font:400 26px/1.15 var(--f-display);margin:36px 0 6px}
p{margin:0}.muted{color:var(--ink-2)}.fine{font-size:13px;color:var(--ink-3)}
ul.items{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
ul.items li{border:1px solid var(--line);border-radius:var(--r);padding:16px}
ul.items .lead{font:600 18px/1.3 var(--f-body);overflow-wrap:anywhere}
ul.items dl{margin:8px 0 0;display:grid;gap:4px}
ul.items dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
ul.items dd{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
form{margin-top:16px}
label{display:block;margin-top:16px;font-size:15px;font-weight:600}
label .opt{font-weight:400;color:var(--ink-3)}
input,textarea,select{display:block;width:100%;margin-top:6px;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid rgba(11,13,31,.24);background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:18px}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none}
button{font:600 16px/1 var(--f-body);padding:15px 20px;border-radius:12px;border:0;cursor:pointer;margin-top:22px;background:var(--ink);color:#fff;width:100%}
button[disabled]{opacity:.6;cursor:default}
.note{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f4f5fa;font-size:15px}
.note.err{background:#fdeee9;color:var(--warn)}.note.ok{background:#e7f6ef;color:var(--good)}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
footer a{color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <p class="biz"><span id="biz"></span><span class="test" id="test" hidden>Test</span></p>
  <div id="app" aria-live="polite"><h1>One moment…</h1></div>
  <footer><p class="fine" id="foot"></p></footer>
</main>
<script>
"use strict";
// A piece of software Pip built for a business (supabase/functions/pip-piece). This page shows only what the piece
// says the public may see, and its form if it has one. Everything a person typed is shown as text, never as markup:
// every value below goes in through textContent.
const FN = "https://qqaikvgjzzcdwumnyspb.supabase.co/functions/v1/pip-piece";
const ID = new URLSearchParams(location.search).get("p") || "";
const $ = (id) => document.getElementById(id), app = $("app");
const NONCE = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^\w-]/g, "").slice(0, 40);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (k === "class") el.className = v; else el.setAttribute(k, v === true ? "" : v); }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const WORDS = { missing: "Please fill in this field: ", bad_value: "Please check this field: ", slow_down: "This is busy right now. Please try again in a few minutes.", full: "This is not taking any more right now.", not_found: "This is no longer open." };

function field(f) {
  const id = "f-" + f.id, common = { id, name: f.id, required: !!f.required, "aria-required": f.required ? "true" : null };
  let input;
  if (f.type === "longtext") input = h("textarea", Object.assign({ maxlength: "2000" }, common));
  else if (f.type === "choice") input = h("select", common, h("option", { value: "" }, "Choose one"), (f.options || []).map((o) => h("option", { value: o }, o)));
  else if (f.type === "yes") return h("label", { class: "check", for: id }, h("input", Object.assign({ type: "checkbox" }, common)), h("span", {}, f.label));
  else input = h("input", Object.assign({ type: { email: "email", phone: "tel", number: "number", date: "date" }[f.type] || "text", maxlength: "200", step: f.type === "number" ? "any" : null, autocomplete: { email: "email", phone: "tel" }[f.type] || "off", inputmode: f.type === "number" ? "decimal" : null }, common));
  return h("label", { for: id }, f.label, f.required ? null : h("span", { class: "opt" }, " (optional)"), input);
}

function pageView(page) {
  const list = page.items.length
    ? h("ul", { class: "items" }, page.items.map((it) => {
        const [first, ...rest] = page.fields.filter((f) => it[f.id] !== undefined && it[f.id] !== "");
        return h("li", {}, first ? h("p", { class: "lead" }, String(it[first.id])) : null, rest.length ? h("dl", {}, rest.map((f) => [h("dt", {}, f.label), h("dd", {}, String(it[f.id]))])) : null);
      }))
    : h("p", { class: "note" }, page.empty || "Nothing to show yet.");
  return [h("h1", {}, page.title), page.intro ? h("p", { class: "muted" }, page.intro) : null, list];
}

function formView(form, business, heading) {
  const out = h("div", { role: "status" }), btn = h("button", { type: "submit" }, "Send");
  const consent = form.consent ? h("label", { class: "check", for: "f-consent" }, h("input", { type: "checkbox", id: "f-consent", required: true }), h("span", {}, form.consent)) : null;
  const trap = h("div", { class: "trap", "aria-hidden": "true" }, h("label", { for: "f-website" }, "Leave this empty"), h("input", { id: "f-website", name: "website", tabindex: "-1", autocomplete: "off" }));
  const wrap = h("div", {});
  const el = h("form", { novalidate: true, onsubmit: async (e) => {
    e.preventDefault(); out.replaceChildren();
    const body = { nonce: NONCE, website: el.querySelector("#f-website").value };
    for (const f of form.fields) { const i = el.querySelector("#f-" + f.id); body[f.id] = f.type === "yes" ? i.checked : i.value; }
    if (form.consent) body.consent = el.querySelector("#f-consent").checked;
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await fetch(FN + "/p/" + encodeURIComponent(ID), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { wrap.replaceChildren(h("p", { class: "note ok" }, (form.done || "Thank you. " + business + " has it.") + (j.ref ? " Your reference is " + j.ref + "." : ""))); return; }
      const f = form.fields.find((x) => x.id === j.field);
      const label = j.field === "consent" ? "the tick box" : f ? f.label : "";
      out.replaceChildren(h("p", { class: "note err" }, (WORDS[j.error] || "That did not go through. Please try again.") + (["missing", "bad_value"].includes(j.error) ? label : "")));
      const bad = j.field && el.querySelector("#f-" + j.field); if (bad) bad.focus();
    } catch (x) { out.replaceChildren(h("p", { class: "note err" }, "That did not go through. Check your connection and try again.")); }
    btn.disabled = false; btn.textContent = "Send";
  } }, form.fields.map(field), consent, trap, btn, out);
  wrap.append(el);
  return [h(heading, {}, form.title), form.intro ? h("p", { class: "muted" }, form.intro) : null, wrap];
}

(async () => {
  const gone = (t, s) => app.replaceChildren(h("h1", {}, t), h("p", { class: "muted" }, s));
  if (!/^[0-9a-f-]{36}$/i.test(ID)) return gone("This page is not open", "The link may be old. Ask the business for a new one.");
  try {
    const r = await fetch(FN + "/p/" + encodeURIComponent(ID));
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) return gone("This page is not open", "The link may be old. Ask the business for a new one.");
    const p = j.piece;
    document.title = ((p.page && p.page.title) || (p.form && p.form.title) || p.label) + " · " + p.business;
    $("biz").textContent = p.business; $("test").hidden = !p.test;
    $("foot").replaceChildren("This page is run by Pip, an AI team, for " + p.business + ". ", h("a", { href: "/privacy" }, "Privacy"));
    const parts = [];
    if (p.page) parts.push(...pageView(p.page));
    if (p.form) parts.push(...formView(p.form, p.business, p.page ? "h2" : "h1"));
    if (!parts.length) parts.push(h("h1", {}, p.label), h("p", { class: "muted" }, "This is kept inside " + p.business + ". There is nothing to show here."));
    app.replaceChildren(...parts.filter(Boolean));
  } catch (e) { gone("This page could not load", "Check your connection and refresh the page."); }
})();
</script>
</body>
</html>
