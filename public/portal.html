<script>

const SB_URL = "https://qqaikvgjzzcdwumnyspb.supabase.co";

}

}

    h("p", { class: "xs" }, "Pip never asks for a password or a code by email or text.")

      h("div", { class: "btns" }, h("button", { class: "pri", onclick: () => run(() => api("/business/" + id + "/texting", Object.fromEntries(Object.entries(f).map(([k, el]) => [k, el.value]))), "Saved.") }, "Save")));

function activityTab() {
